name: Check code
on: push

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Hare
              run: sudo apt-get update && sudo apt-get install -y hare

            - name: Run tests
              run: make check DEBUG=1
